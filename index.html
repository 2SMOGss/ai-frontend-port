<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Nexus | Rob Chich</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white overflow-hidden">
    <div id="app" class="h-screen w-full relative flex flex-col">
        
        <!-- Ambient Layers -->
        <canvas id="neural-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>
        <div class="nebula"></div>
        <div class="grid-overlay"></div>
        <div class="noise"></div>

        <!-- Header -->
        <nav class="p-8 flex justify-between items-center z-50">
            <div class="logo font-bold text-2xl tracking-tighter">
                <span class="text-accent">NEURAL</span>_NEXUS
            </div>
            <div class="status-panel flex items-center gap-4 text-[10px] font-mono opacity-50">
                <div class="neural-pulse">
                    <div class="ring"></div>
                    <div class="dot"></div>
                </div>
                <span>LINK_STABLE // <span id="timestamp"></span></span>
            </div>
        </nav>

        <!-- Main HUD Layout -->
        <div class="hud-main">
            <div class="hud-container">
                
                <!-- LEFT HUD: Identity & Stats -->
                <aside class="hud-sidebar left">
                    <div class="hud-panel identity">
                        <h1 class="name">ROB CHICH</h1>
                        <p class="title">Cloud Security & AI Architect</p>
                    </div>

                    <div class="hud-panel competencies">
                        <div class="panel-header">
                            <i data-lucide="brain"></i>
                            <span>CORE_COMPETENCIES</span>
                        </div>
                        <div class="badge-container">
                            <span class="badge">AWS_CLOUD</span>
                            <span class="badge">PYTHON_V3</span>
                            <span class="badge">SECURITY+</span>
                            <span class="badge">ENTRA_ID</span>
                            <span class="badge">SPLUNK</span>
                        </div>
                    </div>
                    
                    <div class="hud-panel metrics">
                        <div class="panel-header">
                            <i data-lucide="activity"></i>
                            <span>SYSTEM_METRICS</span>
                        </div>
                        <div class="metric-grid">
                            <div class="metric-row">
                                <span class="label">Memories</span>
                                <span id="mem-count" class="value text-accent">...</span>
                            </div>
                            <div class="metric-row">
                                <span class="label">Uptime</span>
                                <span id="uptime" class="value">...</span>
                            </div>
                            <div class="metric-row">
                                <span class="label">Latency</span>
                                <span id="latency" class="value">...</span>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- CENTER: Core Terminal -->
                <main class="hud-center">
                    <div id="chat-modal" class="terminal-window">
                        <div class="terminal-header">
                            <div class="window-controls">
                                <span class="control red"></span>
                                <span class="control yellow"></span>
                                <span class="control green"></span>
                            </div>
                            <h2 class="terminal-title">System_Terminal_V1</h2>
                        </div>
                        <div id="chat-body" class="terminal-body scrollbar-hide">
                            <div class="system-message">
                                <span class="timestamp">[0.00s]</span>
                                <span class="content">Link established. All memories synchronized.</span>
                            </div>
                        </div>
                        <div class="terminal-input-container group">
                            <span class="prompt">></span>
                            <input type="text" id="chat-input" placeholder="Query Rob's Open Brain..." class="terminal-input">
                        </div>
                    </div>
                </main>

                <!-- RIGHT HUD: Live Feed -->
                <aside class="hud-sidebar right">
                    <div class="hud-panel stream-panel">
                        <div class="panel-header">
                            <i data-lucide="rss"></i>
                            <span>NEURAL_STREAM</span>
                        </div>
                        <div id="thought-stream" class="thought-stream-container scrollbar-hide">
                            <!-- Thoughts injected here -->
                        </div>
                    </div>
                </aside>
            </div>
        </div>

        </div>

        <!-- Tooltip Cursor Removed -->
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
